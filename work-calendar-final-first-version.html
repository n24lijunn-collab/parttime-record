<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Work Calendar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171b22;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{border:0;background:none;color:inherit}
.app{max-width:820px;margin:auto;min-height:100vh;padding-bottom:95px}
.top{height:92px;display:flex;align-items:end;justify-content:space-between;padding:0 34px 18px;border-bottom:1px solid #edf0f4;position:sticky;top:0;background:#fff;z-index:10}
.icon{font-size:34px;line-height:1;cursor:pointer}.title{font-size:30px;font-weight:800}
.monthbar{display:flex;justify-content:center;align-items:center;gap:58px;padding:54px 20px 8px}
.monthbar button{font-size:40px;color:#697382;cursor:pointer}.month{font-size:40px;font-weight:850}.hint{text-align:center;color:#a0a8b4;font-size:19px;margin-bottom:34px}
.week{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #e6eaf0;border-bottom:0;border-radius:30px 30px 0 0;overflow:hidden;margin:0 20px}
.week div{text-align:center;padding:22px 0;font-size:21px;font-weight:750}.sun{color:#ff3038}.sat{color:#1265ee}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);margin:0 20px;border:1px solid #e6eaf0;border-radius:0 0 30px 30px;overflow:hidden}
.day{height:185px;border-right:1px solid #e6eaf0;border-top:1px solid #e6eaf0;padding:16px 8px;text-align:center;cursor:pointer}.day:nth-child(7n){border-right:0}
.num{font-size:32px;font-weight:650}.muted{color:#cbd0d8}.selected{background:#f3f7ff}.selected .num{display:inline-flex;width:58px;height:58px;border-radius:50%;background:#1667f2;color:#fff;align-items:center;justify-content:center}
.mark{margin:27px auto 9px;width:50px;height:7px;border-radius:9px}.green{background:#19b85b}.orange{background:#ff9f0a}.pink{background:#ff8b97}.blue{background:#1670f5}
.hours{font-size:17px;margin-top:0}.income{font-size:15px;margin-top:4px}.holiday{font-size:15px;color:#1265ee;font-weight:700;margin-top:10px}
.pager{text-align:center;color:#a4abb6;padding:14px 0 20px;font-size:16px}
.detail{margin:0 20px;padding:24px 26px;border-radius:28px;box-shadow:0 4px 22px #17203312;border:1px solid #eef1f5}
.detailHead{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid #edf0f4}.dateTitle{font-size:24px;font-weight:800}.badge{font-size:14px;padding:7px 11px;border-radius:8px;background:#eaf2ff;color:#1265ee;margin-left:8px}.edit{border:1px solid #e0e5ec;border-radius:10px;padding:9px 15px;cursor:pointer}
.info{display:grid;gap:18px;padding:18px 0}.row{display:flex;justify-content:space-between;gap:15px;font-size:18px}.label{color:#68717e}.value{font-weight:600;text-align:right}
.add{width:100%;background:#1265ee;color:#fff;border-radius:12px;padding:15px;font-size:19px;cursor:pointer}
.summary{display:grid;grid-template-columns:1fr 1fr;margin:22px 20px 0;padding:24px 20px;border-radius:25px;box-shadow:0 4px 22px #17203310}.sum{text-align:center}.sum:first-child{border-right:1px solid #e4e8ee}.sumLabel{color:#68717e;font-size:17px}.sumValue{font-size:25px;font-weight:800;margin-top:7px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:88px;background:#fff;border-top:1px solid #e5e8ed;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav{text-align:center;padding-top:12px;color:#68717e;font-size:14px;cursor:pointer}.navIcon{font-size:27px;height:32px}.nav.active{color:#1265ee;font-weight:750}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:end;z-index:30}.sheet{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:820px;margin:auto;padding:22px 22px 34px}.sheet h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:14px;color:#68717e;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #dfe4eb;border-radius:12px;padding:12px;background:#fafbfc}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:12px}.cancel{background:#eef1f5}.save{background:#1265ee;color:#fff}
@media(max-width:600px){.top{height:82px;padding:0 20px 15px}.title{font-size:25px}.monthbar{padding-top:35px;gap:38px}.month{font-size:34px}.monthbar button{font-size:34px}.week,.calendar{margin-left:10px;margin-right:10px}.week div{font-size:17px;padding:16px 0}.day{height:138px;padding:10px 3px}.num{font-size:25px}.selected .num{width:48px;height:48px}.mark{margin-top:18px;width:40px}.hours{font-size:14px}.income{font-size:12px}.detail{margin:0 10px;padding:20px}.summary{margin-left:10px;margin-right:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><button class="icon" onclick="alert('메뉴 기능')">☰</button><div class="title">工作日历</div><div><button class="icon" onclick="alert('검색 기능')">⌕</button><button class="icon" onclick="openModal()">＋</button></div></header>
<div class="monthbar"><button onclick="changeMonth(-1)">‹</button><div class="month" id="monthTitle"></div><button onclick="changeMonth(1)">›</button></div>
<div class="hint">左右滑动切换月份</div>
<div class="week"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>
<div class="calendar" id="calendar"></div>
<div class="pager">●　○　○　○</div>
<div class="detail" id="detail"></div>
<div class="summary"><div class="sum"><div class="sumLabel">이번 달 근무일</div><div class="sumValue" id="workDays">0일</div></div><div class="sum"><div class="sumLabel">이번 달 수입</div><div class="sumValue" id="monthIncome">₩0</div></div></div>
</div>
<nav class="bottom">
<div class="nav active"><div class="navIcon">▣</div>캘린더</div><div class="nav"><div class="navIcon">▱</div>작업</div><div class="nav"><div class="navIcon">₩</div>수입</div><div class="nav"><div class="navIcon">▥</div>통계</div><div class="nav"><div class="navIcon">▤</div>资讯</div>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
<h2 id="modalTitle">작업 기록 추가</h2>
<div class="field"><label>날짜</label><input id="fDate" type="date"></div>
<div class="field"><label>근무지</label><input id="fPlace" placeholder="근무지를 입력하세요"></div>
<div class="field"><label>업종 / 직무</label><input id="fJob" placeholder="업종 또는 직무"></div>
<div class="field"><label>시간</label><input id="fHours" type="number" step="0.5" placeholder="8"></div>
<div class="field"><label>수입</label><input id="fIncome" type="number" placeholder="150000"></div>
<div class="field"><label>메모</label><textarea id="fMemo" rows="3" placeholder="메모"></textarea></div>
<div class="actions"><button class="cancel" onclick="closeModal()">취소</button><button class="save" onclick="saveRecord()">저장</button></div>
</div></div>

<script>
const key='workCalendarDataV1';
let data=JSON.parse(localStorage.getItem(key)||'{}');
let current=new Date(2026,8,1), selected='2026-09-02', editKey=null;
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function save(){localStorage.setItem(key,JSON.stringify(data))}
function monthName(y,m){return `${y}년 ${m+1}월`}
function render(){
 document.getElementById('monthTitle').textContent=monthName(current.getFullYear(),current.getMonth());
 const cal=document.getElementById('calendar');cal.innerHTML='';
 const y=current.getFullYear(),m=current.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
 for(let i=0;i<35;i++){
  let d=i-first+1, yy=y, mm=m, muted=false;
  if(d<1){d=prev+d;mm=m-1;muted=true;if(mm<0){mm=11;yy--}} else if(d>days){d=d-days;mm=m+1;muted=true;if(mm>11){mm=0;yy++}}
  const k=iso(yy,mm,d), r=data[k]; const el=document.createElement('div');el.className='day'+(muted?' muted ':'')+(k===selected?' selected':'');
  let mark=r?(r.hours>=8?'green':r.hours>=4?'orange':'pink'):''; let extra=r?`<div class="mark ${mark}"></div><div class="hours">${r.hours||0}h</div>${r.income?`<div class="income">₩${Number(r.income).toLocaleString()}</div>`:''}`:'';
  el.innerHTML=`<div class="num">${d}</div>${extra}`;el.onclick=()=>{selected=k;renderDetail();render()};cal.appendChild(el);
 }
 let work=Object.entries(data).filter(([k])=>k.startsWith(`${y}-${pad(m+1)}-`)&&Number(data[k].hours||0)>0).length;
 let inc=Object.entries(data).filter(([k])=>k.startsWith(`${y}-${pad(m+1)}-`)).reduce((s,[k,v])=>s+Number(v.income||0),0);
 document.getElementById('workDays').textContent=work+'일';document.getElementById('monthIncome').textContent='₩'+inc.toLocaleString();
}
function renderDetail(){
 const r=data[selected], d=new Date(selected+'T00:00:00'), text=`${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;
 document.getElementById('detail').innerHTML=`<div class="detailHead"><div class="dateTitle">${text}${r?'':' <span class="badge">휴무</span>'}</div>${r?'<button class="edit" onclick="openModal(selected)">✎ 수정</button>':''}</div>
 <div class="info"><div class="row"><span class="label">⌖　근무지</span><span class="value">${r?.place||'-'}</span></div><div class="row"><span class="label">▣　업종/직무</span><span class="value">${r?.job||'-'}</span></div><div class="row"><span class="label">◷　시간</span><span class="value">${r?.hours?r.hours+'h':'-'}</span></div><div class="row"><span class="label">$　수입</span><span class="value">₩${Number(r?.income||0).toLocaleString()}</span></div><div class="row"><span class="label">▤　메모</span><span class="value">${r?.memo||'메모가 없습니다.'}</span></div></div>
 <button class="add" onclick="openModal()">＋ 작업 기록 추가</button></div>`;
}
function changeMonth(n){current.setMonth(current.getMonth()+n);selected=iso(current.getFullYear(),current.getMonth(),Math.min(2,new Date(current.getFullYear(),current.getMonth()+1,0).getDate()));render();renderDetail()}
function openModal(k){editKey=k||null;document.getElementById('modal').style.display='flex';let r=k?data[k]:data[selected];document.getElementById('modalTitle').textContent=k?'작업 기록 수정':'작업 기록 추가';document.getElementById('fDate').value=k||selected;document.getElementById('fPlace').value=r?.place||'';document.getElementById('fJob').value=r?.job||'';document.getElementById('fHours').value=r?.hours||'';document.getElementById('fIncome').value=r?.income||'';document.getElementById('fMemo').value=r?.memo||''}
function closeModal(){document.getElementById('modal').style.display='none'}
function saveRecord(){const k=document.getElementById('fDate').value;if(!k)return;data[k]={place:fPlace.value,job:fJob.value,hours:Number(fHours.value||0),income:Number(fIncome.value||0),memo:fMemo.value};selected=k;current=new Date(k+'T00:00:00');current.setDate(1);save();closeModal();render();renderDetail()}
render();renderDetail();
let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX);document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)changeMonth(dx<0?1:-1)});
</script>
</body></html>
